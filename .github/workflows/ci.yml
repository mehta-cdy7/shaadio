name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  # Keep the mongod binary used by integration tests outside node_modules so it can be cached.
  MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # setup-node v5 caches the packageManager's store by default, which needs pnpm on PATH
          # before `corepack enable` runs. Turn it off rather than reorder.
          package-manager-cache: false

      - name: Enable pnpm (version from package.json packageManager)
        run: corepack enable

      - uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Unit + integration (in-memory MongoDB replica set). Includes the mandatory security suites.
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E smoke (Playwright)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017/shaadioo-e2e
      APP_ORIGIN: http://localhost:3100
      MONGOMS_DISABLE_POSTINSTALL: '1' # e2e uses the mongo service, not the in-memory binary
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # setup-node v5 caches the packageManager's store by default, which needs pnpm on PATH
          # before `corepack enable` runs. Turn it off rather than reorder.
          package-manager-cache: false

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
